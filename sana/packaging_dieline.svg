<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520">
  <rect width="800" height="520" fill="#FAF7F2" />
  <g stroke="#1E242B" stroke-width="2" fill="none">
    <!-- Outer Box Base (90x90x32mm scaled) -->
    <rect x="80" y="60" width="380" height="380" fill="#FFFFFF" stroke="#1E242B" stroke-width="2" />
    <!-- Fold lines -->
    <rect x="148" y="128" width="244" height="244" stroke="#2E5E4E" stroke-width="1.5" stroke-dasharray="6,6" fill="#F6F3EC" />
    <line x1="148" y1="60" x2="148" y2="440" stroke="#2E5E4E" stroke-width="1.2" stroke-dasharray="5,5" />
    <line x1="392" y1="60" x2="392" y2="440" stroke="#2E5E4E" stroke-width="1.2" stroke-dasharray="5,5" />
    <line x1="80" y1="128" x2="460" y2="128" stroke="#2E5E4E" stroke-width="1.2" stroke-dasharray="5,5" />
    <line x1="80" y1="372" x2="460" y2="372" stroke="#2E5E4E" stroke-width="1.2" stroke-dasharray="5,5" />
    <!-- Dedicated Backing Card (55x75mm scaled) -->
    <rect x="540" y="110" width="180" height="245" fill="#FFFFFF" stroke="#1E242B" stroke-width="2" rx="2" />
    <line x1="565" y1="225" x2="600" y2="225" stroke="#9E7B47" stroke-width="2" />
    <line x1="660" y1="225" x2="695" y2="225" stroke="#9E7B47" stroke-width="2" />
  </g>
  <text x="270" y="242" text-anchor="middle" font-family="Georgia, serif" font-size="26" fill="#1E242B">Sana</text>
  <text x="270" y="266" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#5A626A">flower_jewelry</text>
  <text x="270" y="305" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#2E5E4E">Gift Box Base: 90mm × 90mm × H32mm</text>

  <text x="630" y="168" text-anchor="middle" font-family="Georgia, serif" font-size="24" fill="#1E242B">Sana</text>
  <text x="630" y="188" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#5A626A">flower_jewelry</text>
  <text x="630" y="328" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#1E242B">□ pierce   □ earring   □ other</text>
  <text x="630" y="385" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#5A626A">Backing Card: 55mm × 75mm</text>
</svg>
