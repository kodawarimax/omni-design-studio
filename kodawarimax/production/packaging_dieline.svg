<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 860" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0F1722; }
      .grid { stroke: rgba(255,255,255,0.05); stroke-width: 1; }
      .bleed { fill: none; stroke: #22C55E; stroke-width: 1.5; stroke-dasharray: 8 4; }
      .cut { fill: rgba(24,34,47,0.85); stroke: #F43F5E; stroke-width: 2.2; }
      .fold { fill: none; stroke: #38BDF8; stroke-width: 1.8; stroke-dasharray: 6 4; }
      .foil { fill: none; stroke: #C86D51; stroke-width: 1.8; }
      .foil-fill { fill: #C86D51; }
      .dim { stroke: #94A3B8; stroke-width: 1; }
      .txt-title { fill: #F6F3EE; font-family: 'Noto Sans JP', sans-serif; font-size: 18px; font-weight: 700; letter-spacing: 0.08em; }
      .txt-sub { fill: #94A3B8; font-family: 'Inter', monospace; font-size: 11px; letter-spacing: 0.06em; }
      .txt-foil { fill: #E08E73; font-family: 'Inter', 'Noto Sans JP', sans-serif; font-weight: 700; text-anchor: middle; }
      .txt-panel { fill: rgba(246,243,238,0.65); font-family: 'Inter', 'Noto Sans JP', sans-serif; font-size: 11px; text-anchor: middle; }
    </style>
  </defs>
  <rect width="1200" height="860" class="bg"/>
  <!-- Technical Grid -->
  <g class="grid">
    <line x1="0" y1="100" x2="1200" y2="100"/><line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/><line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="500" x2="1200" y2="500"/><line x1="0" y1="600" x2="1200" y2="600"/>
    <line x1="0" y1="700" x2="1200" y2="700"/><line x1="0" y1="800" x2="1200" y2="800"/>
    <line x1="150" y1="0" x2="150" y2="860"/><line x1="300" y1="0" x2="300" y2="860"/>
    <line x1="450" y1="0" x2="450" y2="860"/><line x1="600" y1="0" x2="600" y2="860"/>
    <line x1="750" y1="0" x2="750" y2="860"/><line x1="900" y1="0" x2="900" y2="860"/>
    <line x1="1050" y1="0" x2="1050" y2="860"/>
  </g>

  <!-- Header Block -->
  <text x="48" y="48" class="txt-title">RECBOT — 現場AI導入スターターキット 化粧箱展開図 (1:1 VECTOR DIELINE)</text>
  <text x="48" y="70" class="txt-sub">SPEC: W260 × D190 × H45 mm | マグネットブック型貼箱＋スリーブ | 用紙: タント N-13 濃紺マット + カッパー箔押し (FOIL: #C86D51)</text>

  <!-- Legend -->
  <g transform="translate(820, 32)">
    <line x1="0" y1="10" x2="28" y2="10" class="cut"/><text x="36" y="14" class="txt-sub">CUT LINE (実線・抜き)</text>
    <line x1="175" y1="10" x2="203" y2="10" class="fold"/><text x="211" y="14" class="txt-sub">CREASING (破線・折り)</text>
    <line x1="0" y1="32" x2="28" y2="32" class="bleed"/><text x="36" y="36" class="txt-sub">BLEED 3mm (塗り足し)</text>
    <line x1="175" y1="32" x2="203" y2="32" class="foil"/><text x="211" y="36" class="txt-sub">COPPER FOIL (銅箔押し)</text>
  </g>

  <!-- Outer Bleed Boundary -->
  <rect x="208" y="102" width="524" height="676" rx="6" class="bleed"/>

  <!-- Main Rigid Book-Style Box Dieline -->
  <!-- Left Flap (45mm -> 68px), Center Tray/Base (260mm -> 380px), Right Flap (45mm -> 68px) -->
  <!-- Top Flap (68px) -->
  <rect x="280" y="110" width="380" height="68" class="cut"/>
  <!-- Base Tray (260x190 -> 380x270) -->
  <rect x="280" y="178" width="380" height="270" class="cut"/>
  <!-- Left & Right Tray Walls -->
  <rect x="212" y="178" width="68" height="270" class="cut"/>
  <rect x="660" y="178" width="68" height="270" class="cut"/>
  <!-- Spine Wall (45mm -> 68px) -->
  <rect x="280" y="448" width="380" height="68" class="cut"/>
  <!-- Top Cover Lid (260x190 -> 380x270) -->
  <rect x="280" y="516" width="380" height="270" class="cut"/>
  <!-- Magnetic Front Closure Flap (42mm -> 62px) -->
  <rect x="280" y="786" width="380" height="58" class="cut"/>

  <!-- Crease Lines -->
  <line x1="280" y1="178" x2="660" y2="178" class="fold"/>
  <line x1="280" y1="448" x2="660" y2="448" class="fold"/>
  <line x1="280" y1="516" x2="660" y2="516" class="fold"/>
  <line x1="280" y1="786" x2="660" y2="786" class="fold"/>
  <line x1="280" y1="178" x2="280" y2="448" class="fold"/>
  <line x1="660" y1="178" x2="660" y2="448" class="fold"/>

  <!-- Panel Annotations (Base Tray Inside) -->
  <text x="470" y="220" class="txt-panel">INNER BASE TRAY (内箱トレイ: W260 × D190 mm)</text>
  <!-- Die-cut EVA Foam Slots inside Tray -->
  <rect x="306" y="240" width="195" height="184" rx="4" class="fold"/>
  <text x="403" y="325" class="txt-panel">① 現場運用プレイブック</text>
  <text x="403" y="343" class="txt-panel">＆プロンプト設計書 (A5バインダー)</text>

  <rect x="518" y="240" width="116" height="82" rx="4" class="fold"/>
  <text x="576" y="280" class="txt-panel">② NFC Quick Card</text>
  <text x="576" y="296" class="txt-panel">(85.6 × 54 mm)</text>

  <rect x="518" y="336" width="116" height="88" rx="4" class="fold"/>
  <text x="576" y="378" class="txt-panel">③ QR導入ガイド</text>
  <text x="576" y="394" class="txt-panel">＆現地チェック票</text>

  <!-- Spine Foil Print -->
  <text x="470" y="487" class="txt-foil" font-size="13" letter-spacing="4">RECBOT — AI IMPLEMENTATION KIT FOR REAL ESTATE &amp; EC</text>

  <!-- Top Cover Foil Artwork (Copper Foil #C86D51) -->
  <rect x="304" y="540" width="332" height="222" rx="4" class="foil"/>
  <text x="470" y="592" class="txt-foil" font-size="11" letter-spacing="5">REAL ESTATE × E-COMMERCE AI PARTNER</text>
  <text x="470" y="642" class="txt-foil" font-size="34" letter-spacing="8">RECBOT</text>
  <text x="470" y="672" class="txt-foil" font-size="13" letter-spacing="2">現場の仕事に、頼れる相棒を。</text>
  <line x1="410" y1="692" x2="530" y2="692" class="foil"/>
  <text x="470" y="718" class="txt-foil" font-size="10" letter-spacing="3">FIELD WORKFLOW &amp; ONBOARDING KIT</text>
  <text x="470" y="742" class="txt-foil" font-size="10" letter-spacing="2">https://kodawarimax.net</text>

  <!-- Magnetic Flap Dual Neodymium Magnet Positions -->
  <circle cx="350" cy="815" r="10" class="foil"/>
  <circle cx="590" cy="815" r="10" class="foil"/>
  <text x="470" y="820" class="txt-panel">MAGNETIC CLOSURE FLAP (内蔵ネオジム磁石 ×2)</text>

  <!-- Right Side: Outer Belly Band / Obi Sleeve & NFC Smart Card Spec -->
  <g transform="translate(790, 110)">
    <rect x="0" y="0" width="350" height="410" rx="6" class="cut" style="fill:rgba(246,243,238,0.06);"/>
    <rect x="14" y="14" width="322" height="382" rx="4" class="foil"/>
    <text x="175" y="48" class="txt-foil" font-size="13" letter-spacing="3">OUTER BELLY BAND (外巻き帯スリーブ)</text>
    <text x="175" y="70" class="txt-panel">用紙: アラベール スノーホワイト 160kg (W620 × H95 mm)</text>
    <line x1="30" y1="90" x2="320" y2="90" class="fold"/>
    <text x="175" y="130" class="txt-foil" font-size="16">「いつもの入力、返信、集計。その繰り返しにAIを。」</text>
    <text x="175" y="162" class="txt-panel">01 不動産向け支援：物件紹介・反響・改修提案＆案件管理</text>
    <text x="175" y="186" class="txt-panel">02 EC向け支援：Shopee初期出品・自動化 / EC向けAIO対策</text>
    <line x1="30" y1="215" x2="320" y2="215" class="fold"/>
    <text x="175" y="250" class="txt-foil" font-size="12">収録物一覧（裏面表記）</text>
    <text x="175" y="276" class="txt-panel">・現場業務の棚卸し＆AIプロンプト運用マニュアル (1冊)</text>
    <text x="175" y="298" class="txt-panel">・RECBOT Quick Launch NFCデスクカード (2枚)</text>
    <text x="175" y="320" class="txt-panel">・不動産現地記録 / EC出品AIOチェックシート (ラミネート版)</text>
    <text x="175" y="365" class="txt-sub" text-anchor="middle">MADE IN JAPAN | © 2026 RECBOT (kodawarimax.net)</text>
  </g>

  <!-- NFC Card Dieline -->
  <g transform="translate(790, 560)">
    <rect x="0" y="0" width="350" height="220" rx="14" class="cut"/>
    <rect x="14" y="14" width="322" height="192" rx="10" class="foil"/>
    <text x="175" y="55" class="txt-foil" font-size="12" letter-spacing="3">NFC DESK LAUNCH CARD (85.6 × 54.0 mm CR80)</text>
    <text x="175" y="102" class="txt-foil" font-size="24" letter-spacing="5">RECBOT AI</text>
    <text x="175" y="130" class="txt-panel">スマホをかざして現場ワークフロー＆プロンプトを起動</text>
    <text x="175" y="168" class="txt-sub" text-anchor="middle">NTAG215 NFC CHIP + QR CODE BACKSIDE | MATTE PVC</text>
  </g>
</svg>